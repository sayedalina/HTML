<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>svg</title>
</head>
<body>
    <svg width="1000" height="600" viewBox="0 0 1000 600"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1d3a"/>
      <stop offset="100%" stop-color="#1e3f7a"/>
    </linearGradient>

    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#ffb300"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="600" fill="url(#bg)"/>

  <!-- Stadium -->
  <ellipse cx="500" cy="520" rx="430" ry="120"
           fill="#1c1c1c"/>
  <ellipse cx="500" cy="520" rx="320" ry="80"
           fill="#1d7f3a"/>

  <!-- Floodlights -->
  <rect x="80" y="120" width="15" height="220" fill="#888"/>
  <rect x="905" y="120" width="15" height="220" fill="#888"/>

  <rect x="45" y="90" width="85" height="40" fill="#fff"/>
  <rect x="870" y="90" width="85" height="40" fill="#fff"/>

  <!-- Virat silhouette -->
  <g transform="translate(250,250)">
    <circle cx="0" cy="-70" r="30" fill="#111"/>
    <rect x="-25" y="-40" width="50" height="90" fill="#111"/>
    <line x1="-10" y1="50" x2="-25" y2="120"
          stroke="#111" stroke-width="12"/>
    <line x1="10" y1="50" x2="25" y2="120"
          stroke="#111" stroke-width="12"/>
    <rect x="35" y="-20" width="15" height="120"
          fill="#c68642" transform="rotate(-20 35 -20)"/>
  </g>

  <!-- Rohit silhouette -->
  <g transform="translate(500,250)">
    <circle cx="0" cy="-70" r="30" fill="#111"/>
    <rect x="-25" y="-40" width="50" height="90" fill="#111"/>
    <line x1="-10" y1="50" x2="-25" y2="120"
          stroke="#111" stroke-width="12"/>
    <line x1="10" y1="50" x2="25" y2="120"
          stroke="#111" stroke-width="12"/>
    <rect x="35" y="-20" width="15" height="120"
          fill="#c68642" transform="rotate(15 35 -20)"/>
  </g>

  <!-- Dhoni silhouette -->
  <g transform="translate(750,250)">
    <circle cx="0" cy="-70" r="30" fill="#111"/>
    <rect x="-25" y="-40" width="50" height="90" fill="#111"/>
    <line x1="-10" y1="50" x2="-25" y2="120"
          stroke="#111" stroke-width="12"/>
    <line x1="10" y1="50" x2="25" y2="120"
          stroke="#111" stroke-width="12"/>

    <!-- Gloves -->
    <circle cx="-40" cy="0" r="10" fill="#111"/>
    <circle cx="40" cy="0" r="10" fill="#111"/>
  </g>

  <!-- Title -->
  <text x="500" y="80"
        text-anchor="middle"
        font-size="44"
        font-weight="bold"
        fill="url(#gold)">
    INDIAN CRICKET LEGENDS
  </text>

  <!-- Names -->
  <text x="250" y="500"
        text-anchor="middle"
        font-size="28"
        fill="#fff">VIRAT KOHLI</text>

  <text x="500" y="500"
        text-anchor="middle"
        font-size="28"
        fill="#fff">ROHIT SHARMA</text>

  <text x="750" y="500"
        text-anchor="middle"
        font-size="28"
        fill="#fff">MS DHONI</text>

  <!-- Tribute text -->
  <text x="500" y="560"
        text-anchor="middle"
        font-size="20"
        fill="#ddd">
    Legends Who Inspired Millions
  </text>

</svg>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>
    <form>
    <h2> Registration Form</h2>
     <label for="#">Name:</label>
     <input type="text" name="#" id="#" placeholder="Enter Your Name"> <br><br>

     <label for="#">Email:</label>
     <input type="email" name="#" id="#" placeholder="Enter Your Email"> <br><br>

     <label for="#">phone number</label>
     <input type="tel" name="#" id="#" placeholder="Enter Your Phone Number"> <br><br>

     <label for="#">Password:</label>
     <input type="password" name="#" id="#" placeholder="Enter Password"> <br><br>

     <label for="#">Confirm Password:</label>
     <input type="password" name="#" id="#" placeholder="Re-Enter Password"> <br><br>

     <input type="submit" value="Register">
     <input type="reset" value="Reset">
    </form>
</body>
</html>

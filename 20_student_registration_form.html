<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>student admission form</title>
</head>
<body>
    <form>
        <h2>Student Registration Form</h2>
    
        <label for = "#"> Student Name: </label>
        <input type = "text" name = "#" id = "#" placeholder = "enter your name"><br><br>

        <label for = "#"> Father's Name: </label>
        <input type = "text" name = "#" id = "#" placeholder = "enter your father name"><br><br>

        <label for = "#"> Mother's Name: </label>
        <input type = "text" name = "#" id = "#" placeholder = "enter your mother name"><br><br>
        
        <label for = "#"> Email: </label>
        <input type = "email" name = "#" id = "#" placeholder = "enter your email"><br><br>

        <label for = "#"> Mobile No: </label>
        <input type = "tel" name = "#" id = "#" placeholder  = "enter mobile no"> <br><br>

        <label for = "#"> Gender: </label>
        <input type = "radio" name = "#" id = "#" value = "male">Male
        <input type = "radio" name = "#" id = "#" value = "female">Female
        <input type = "radio" name = "#" id = "#" value = "other">Other <br><br>

        <label for = "#"> Date of Birth: </label>
        <input type = "date" name = "#" id = "#" placeholder = "enter date of birth"> <br><br
        <label for = "#"> Select Course: </label>
        <select name = "#" id = "#">
            <option value = "">select a course</option>
            <option value = "co">co</option>
            <option value = "it">it</option>
            <option value = "ai">ai</option>
            <option value = "ee">ee</option>
            <option value = "me">me</option>
            <option value = "ej">ej</option>
        </select><br><br>

        <label for = "#"> Address: </label>
        <textarea rows="2" cols="30"></textarea> <br><br>

        <label for = "#"> Hobbies: </label>
        <input type = "checkbox" name = "#" id = "#" value = "cricket">Cricket
        <input type = "checkbox" name = "#" id = "#" value = "singing">Singing
        <input type = "checkbox" name = "#" id = "#" value = "reading story books">Reading Story Books<br><br>

        <label for = "#"> upload photo: </label>
        <input type = "file" name = "#" id = "#" ><br><br>

        <input type = "submit" value = "Submit">
        <input type = "reset" value = "Reset">


    </form>
</body>
</html>
